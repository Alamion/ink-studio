name: Release

# Push a tag equal to the manifest version (no "v"), for example: git tag 0.1.0 && git push origin 0.1.0

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:release "${GITHUB_REF_NAME}"
      - run: pnpm check
      - run: pnpm build
      - name: Create the release with the three plugin files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" --generate-notes \
            apps/obsidian-ink-graph/main.js \
            apps/obsidian-ink-graph/manifest.json \
            apps/obsidian-ink-graph/styles.css
